# One-command demo: docker compose up --build   then open http://localhost:3000
# Add API keys in a .env file next to this one to leave demo mode (see .env.example / CLIENT-GUIDE.md).
services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "4000:4000"
    env_file:
      - path: .env
        required: false
